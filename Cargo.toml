[package]
name = "dnsranker"
version = "0.1.0"
edition = "2024"
description = "Rank DNS resolvers (plain DNS, DoT, DoH) by the latency they deliver on popular domains"
readme = "README.md"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
console = "0.16.4"
indicatif = "0.18.6"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
rustls = "0.23.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.9"
